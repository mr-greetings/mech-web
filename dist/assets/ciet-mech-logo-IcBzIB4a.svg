<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- CIET Mechanical Engineering Logo Placeholder -->
  <defs>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Technical Coordinate Frame / Gear Icon -->
  <g transform="translate(6, 6)">
    <!-- Outer CAD Calibration Ring -->
    <circle cx="26" cy="26" r="24" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
    
    <!-- Precision Mechanical Gear -->
    <path d="M26 6 L28.5 11 L33.5 9 L34.5 14 L39.5 14 L38.5 19 L43 21 L40 25.5 L43.5 28 L39 31 L41 36 L36 36.5 L36 41.5 L31 40 L28.5 44.5 L26 40 L23.5 44.5 L21 40 L16 41.5 L16 36.5 L11 36 L13 31 L8.5 28 L12 25.5 L9 21 L13.5 19 L12.5 14 L17.5 14 L18.5 9 L23.5 11 Z" 
          fill="url(#gearGrad)" />
    
    <!-- Center Hub & Bore -->
    <circle cx="26" cy="26" r="9" fill="#0d1117" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="26" cy="26" r="4.5" fill="url(#glowGrad)" />
    
    <!-- Precision Crosshairs -->
    <line x1="26" y1="2" x2="26" y2="8" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="26" y1="44" x2="26" y2="50" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="2" y1="26" x2="8" y2="26" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="44" y1="26" x2="50" y2="26" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Typography: CIET & Mechanical Engineering -->
  <g transform="translate(68, 14)">
    <text x="0" y="15" fill="#f8fafc" font-family="'JetBrains Mono', 'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="0.08em">
      CIET <tspan fill="#38bdf8">MECH</tspan>
    </text>
    <text x="0" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.12em">
      DEPARTMENT OF MECHANICAL ENGG
    </text>
    <text x="0" y="39" fill="#3b82f6" font-family="monospace" font-size="7" font-weight="500" letter-spacing="0.06em">
      [LOGO PLACEHOLDER · CLICK TO EDIT]
    </text>
